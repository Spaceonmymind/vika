x-php-common: &php-common
  image: registry.ugraphic.ru/vi/images/laravel-php/dev:latest
  platform: linux/arm64
  env_file:
    - ../.env
  networks:
    - vi-app
    - ${COMPOSE_NETWORK_NAME}

x-php-common-env: &php-common-env
  TZ: ${SERVER_TIMEZONE}
  PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d/common/:/usr/local/etc/php/conf.d/:/usr/local/etc/php/conf.d/site/
  XDEBUG_MODE: off

services:
  nginx:
    image: nginx:1.29-otel
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: always
    depends_on:
      - php-fpm
    environment:
      TZ: ${SERVER_TIMEZONE}
      CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-nginx
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${COMPOSE_COMMON_PROJECT_NAME}_${COMPOSE_NETWORK_NAME}"

      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ssl.rule=Host(`${PROJECT_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ssl.entrypoints=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ssl.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ssl.tls.certresolver=${PROJECT_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-ssl.middlewares=${PROJECT_SSL_MIDDLEWARES}"

      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${PROJECT_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=http"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${PROJECT_MIDDLEWARES}"

      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
    volumes:
      - ./config/nginx/templates:/etc/nginx/templates
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../:/var/www:cached
    networks:
      - vi-app
      - ${COMPOSE_NETWORK_NAME}

  php-fpm:
    <<: *php-common
    container_name: ${COMPOSE_PROJECT_NAME}-php-fpm
    restart: always
    environment:
      <<: *php-common-env
      OTEL_SERVICE_NAME: ${COMPOSE_PROJECT_NAME}-php-fpm
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=Docker}
      XDEBUG_SESSION: ${XDEBUG_SESSION:-PHPSTORM}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./config/php/php.ini:/usr/local/etc/php/php.ini:ro # Базовый конфиг
      - ./config/php/conf.d/:/usr/local/etc/php/conf.d/common/:ro # Конфиги php-fpm
      - ./config/php/php-fpm.d/zzz-custom.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf
      - ../:/var/www:cached
      - ./../../../config/msmtp/msmtprc:/etc/msmtprc:ro
      - ./storage/logs/xdebug:/tmp/xdebug/xdebug.log
    external_links:
      - ${COMPOSE_PROJECT_NAME}-nginx:${PROJECT_HOST}
    extra_hosts:
      - "${PROJECT_HOST}:host-gateway"
    #      - "host.docker.internal:host-gateway" # для включения XDebug в линукс-подобных системах (в MacOS и Windows host.docker.internal итак работает)
    user: "${UID}:${GID}"

  reverb:
    <<: *php-common
    container_name: ${COMPOSE_PROJECT_NAME}-reverb
    restart: always
    command: php artisan reverb:start
    stop_signal: SIGTERM
    healthcheck:
      test: [ "CMD", "healthcheck-reverb" ]
      start_period: 10s
    volumes:
      - ./config/php/php.ini:/usr/local/etc/php/php.ini:ro # Базовый конфиг
      - ./config/php/conf.d/:/usr/local/etc/php/conf.d/site/:ro # Конфиги php-fpm
      - ./config/php/php-fpm.d/zzz-custom.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf
      - ../:/var/www:cached
      - ./../../../config/msmtp/msmtprc:/etc/msmtprc:ro
      - ./bin/healthcheck-reverb:/usr/local/bin/healthcheck-reverb:ro
    environment:
      <<: *php-common-env
      OTEL_SERVICE_NAME: ${COMPOSE_PROJECT_NAME}-reverb
    depends_on:
      - php-fpm
    expose:
      - "8080"

  horizon:
    <<: *php-common
    container_name: ${COMPOSE_PROJECT_NAME}-horizon
    restart: always
    command: php artisan horizon
    stop_signal: SIGTERM
    healthcheck:
      test: [ "CMD", "healthcheck-horizon" ]
      start_period: 10s
    volumes:
      - ./config/php/php.ini:/usr/local/etc/php/php.ini:ro # Базовый конфиг
      - ./config/php/conf.d/:/usr/local/etc/php/conf.d/site/:ro # Конфиги php-fpm
      - ./config/horizon/supervisord.conf:/etc/supervisord.conf:ro # Конфиги php-fpm
      - ./config/horizon/supervisor.d/:/etc/supervisor.d # Конфиги php-fpm
      - ./config/php/php-fpm.d/zzz-custom.conf:/usr/local/etc/php-fpm.d/zzz-custom.conf
      - ../:/var/www:cached
      - ./../../../config/msmtp/msmtprc:/etc/msmtprc:ro
      - ./bin/healthcheck-horizon:/usr/local/bin/healthcheck-horizon:ro
    environment:
      <<: *php-common-env
      OTEL_SERVICE_NAME: ${COMPOSE_PROJECT_NAME}-horizon
    depends_on:
      - php-fpm
    expose:
      - 9001

  vikasearch:
    image: registry.ugraphic.ru/vi/vikasearch/vikasearch:latest
    container_name: ${COMPOSE_PROJECT_NAME}-vikasearch
    restart: always
    env_file:
      - ./../.env
    depends_on:
      - vikasearch-db
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vikasearch-ssl.rule=Host(`vikasearch.${PROJECT_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vikasearch-ssl.entrypoints=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vikasearch-ssl.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vikasearch-ssl.tls.certresolver=${PROJECT_CERT_RESOLVER}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vikasearch-ssl.middlewares=${PROJECT_SSL_MIDDLEWARES}"

      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vikasearch.rule=Host(`vikasearch.${PROJECT_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vikasearch.entrypoints=http"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vikasearch.middlewares=${PROJECT_MIDDLEWARES}"

      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-vikasearch.loadbalancer.server.port=80"
    networks:
      - vi-app
      - ${COMPOSE_NETWORK_NAME}
  vikasearch-db:
    image: pgvector/pgvector:pg16
    container_name: ${COMPOSE_PROJECT_NAME}-vikasearch-db
    env_file:
      - ./../.env
    restart: always
    networks:
      - ${COMPOSE_NETWORK_NAME}


networks:
  vi-app:
    name: ${COMPOSE_PROJECT_NAME}_vi-app
  vi:
    external: true
    name: ${COMPOSE_COMMON_PROJECT_NAME}_${COMPOSE_NETWORK_NAME}

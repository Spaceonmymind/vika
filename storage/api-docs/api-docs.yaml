components:
  schemas:
    Actirovki:
      description: 'Статус актировки'
      properties:
        school_shift:
          description: 'Школьная смена (1 или 2)'
          type: integer
          example: 1
        status:
          description: 'Статус актировки: [pending, announced, not_announced]'
          type: string
          enum:
            - pending
            - announced
            - not_announced
          example: announced
        message:
          description: Сообщение
          type: string
          example: '15.05.2025 занятия 1-й смены с 1 по 4 класс отменяются.'
        row:
          $ref: '#/components/schemas/Row'
      type: object
    City:
      description: 'Населенный пункт'
      properties:
        id:
          description: 'ID населенного пункта'
          type: integer
          example: 1
        name:
          description: 'Название населенного пункта'
          type: string
          example: 'г. Омск'
        fias_id:
          description: 'ФИАС ID'
          type: string
          example: 140e31da-27bf-4519-9ea0-6185d681d44e
      type: object
    Row:
      description: 'Информация об актировке'
      properties:
        id:
          description: 'Уникальный идентификатор'
          type: integer
          format: int64
          example: 1
        city_id:
          description: 'ID населенного пункта'
          type: integer
          format: int64
          example: 10
        weather_id:
          description: 'ID погодных данных'
          type: integer
          format: int64
          example: 5
        weather_range_id:
          description: 'ID диапазона погоды'
          type: integer
          format: int64
          example: 2
        cancel_user_id:
          description: 'ID пользователя, отменившего запись'
          type: integer
          format: int64
          example: 3
        school_shift:
          description: 'Номер школьной смены'
          type: integer
          example: 1
        created_at:
          description: 'Временная метка создания'
          type: string
          format: date-time
          example: '2025-05-12T08:00:00Z'
        cancel_at:
          description: 'Временная метка отмены'
          type: string
          format: date-time
          example: '2025-05-12T12:00:00Z'
          nullable: true
        send_at:
          description: 'Временная метка отправки'
          type: string
          format: date-time
          example: '2025-05-12T15:00:00Z'
          nullable: true
        weather:
          $ref: '#/components/schemas/Weather'
        weatherRange:
          $ref: '#/components/schemas/WeatherRange'
      type: object
    Weather:
      description: 'Данные погоды'
      properties:
        id:
          description: 'ID данных погоды'
          type: integer
          example: 1
        city_id:
          description: 'ID населенного пункта'
          type: integer
          format: int64
          example: 10
        temperature:
          description: Температура
          type: decimal
          example: -27.15
        wind:
          description: 'Скорость ветра'
          type: decimal
          example: 5.1
        created_at:
          description: 'Время создания'
          type: string
          format: date-time
          example: '2025-04-03T05:42:59.000000Z'
        received_at:
          description: 'Время получения данных от метеостанции'
          type: string
          format: date-time
          example: '2025-04-03T05:42:59.000000Z'
      type: object
    WeatherRange:
      description: 'Погодные диапазоны'
      properties:
        id:
          description: 'ID погодного диапазона'
          type: integer
          example: 1
        city_id:
          description: 'ID населенного пункта'
          type: integer
          format: int64
          example: 28
        temperature:
          description: Температура
          type: decimal
          example: -31
        wind:
          description: 'Скорость ветра'
          type: decimal
          example: 10
        school_class:
          description: 'Верхняя граница диапазона классов'
          type: integer
          example: 11
      type: object
    BusinessSupportRegistrationPlace:
      description: 'Места регистрации'
      properties:
        id:
          type: integer
          example: 1
        name:
          description: 'Значение места регистрации'
          type: string
          example: 'Состоящий на налоговом учете и осуществляющий свою деятельность на территории Березовского района'
      type: object
    BusinessSupportSituation:
      description: 'Жизненная ситуация'
      properties:
        id:
          type: integer
          example: 1
        name:
          description: 'Наименование жизненной ситуации'
          type: string
          example: 'Возмещение части затрат на аренду (субаренду) нежилых помещений'
      type: object
    BusinessSupportSubject:
      description: 'Получатель поддержки'
      properties:
        id:
          type: integer
          example: 2
        name:
          description: 'Наименование получателя поддержки'
          type: string
          example: 'Субъект малого и среднего предпринимательства'
      type: object
    BusinessSupportSupportOrganisation:
      description: 'Организация, предоставляющая меру поддержки'
      properties:
        id:
          type: integer
          example: 1
        name:
          description: 'Название организации, предоставляющей меру поддержки'
          type: string
          example: 'Администрация Березовского района'
      type: object
    BusinessSupportSupportType:
      description: 'Тип поддержки'
      properties:
        id:
          type: integer
          example: 1
        name:
          description: 'Наименование типа поддержки'
          type: string
          example: Финансовая
      type: object
    ChatMessage:
      properties:
        id:
          type: integer
        message:
          type: string
        chat_id:
          type: string
        vika_type_id:
          type: integer
        answer:
          type: object
        created_at:
          type: string
          format: date-time
      type: object
    DoctorDayTimetableRecord:
      description: 'Расписание врача на день'
      properties:
        id:
          type: integer
          example: 547835
        day_number:
          description: 'Номер дня, 1 - понедельник'
          type: integer
          example: 1
        break_time:
          description: 'Является ли перерывом, true - перерыв, false - рабочее время'
          type: string
          example: '8:00-18:00'
          nullable: true
        time:
          description: 'Временной диапазон'
          type: string
          example: '8:00-18:00'
          nullable: true
        doctor_id:
          description: 'Идентификатор врача'
          type: integer
          example: 19577
      type: object
    CursorPaginator:
      description: 'Cursor-based пагинация'
      properties:
        per_page:
          description: 'Количество элементов на странице'
          type: integer
          example: 20
        path:
          description: 'Ссылка, куда было обращение'
          type: string
          example: 'http://vi.local/api/widget/business_support/get_measures'
          nullable: true
        next_cursor:
          description: 'Курсор для следующей страницы'
          type: string
          example: eyJidXNpbmVzc19zdXBwb3J0X3dpZGdldF9tZWFzdXJlcy5pZCI6MTUsIl9wb2ludHNUb05leHRJdGVtcyI6dHJ1ZX0
          nullable: true
        next_page_url:
          description: 'URL для следующей страницы'
          type: string
          example: 'http://vi.local/api/widget/business_support/get_measures?cursor=eyJidXNpbmVzc19zdXBwb3J0X3dpZGdldF9tZWFzdXJlcy5pZCI6MTUsIl9wb2ludHNUb05leHRJdGVtcyI6dHJ1ZX0'
          nullable: true
        prev_cursor:
          description: 'Курсор для предыдущей страницы'
          type: string
          example: null
          nullable: true
        prev_page_url:
          description: 'URL для предыдущей страницы'
          type: string
          example: null
          nullable: true
      type: object
    LengthAwarePaginator:
      description: 'Length-aware пагинация'
      properties:
        current_page:
          description: 'Текущая страница'
          type: integer
          example: 1
        first_page_url:
          description: 'URL первой страницы'
          type: string
          example: 'http://vi.local/api/admin/users/list?page=1'
        from:
          description: 'Номер первого элемента на странице'
          type: integer
          example: null
          nullable: true
        last_page:
          description: 'Номер последней страницы'
          type: integer
          example: 1
        last_page_url:
          description: 'URL последней страницы'
          type: string
          example: 'http://vi.local/api/admin/users/list?page=1'
        links:
          description: 'Массив ссылок для навигации'
          type: array
          items:
            properties:
              url:
                description: 'URL страницы'
                type: string
                example: null
                nullable: true
              label:
                description: 'Подпись ссылки'
                type: string
                example: pagination.previous
              active:
                description: 'Активная ли ссылка'
                type: boolean
                example: false
            type: object
        next_page_url:
          description: 'URL следующей страницы'
          type: string
          example: null
          nullable: true
        path:
          description: 'Базовый URL'
          type: string
          example: 'http://vi.local/api/admin/users/list'
        per_page:
          description: 'Количество элементов на страницу'
          type: integer
          example: 15
        prev_page_url:
          description: 'URL предыдущей страницы'
          type: string
          example: null
          nullable: true
        to:
          description: 'Номер последнего элемента на странице'
          type: integer
          example: null
          nullable: true
        total:
          description: 'Общее количество элементов'
          type: integer
          example: 0
      type: object
    SimplePaginator:
      description: 'Simple пагинация'
      properties:
        per_page:
          description: 'Количество элементов на странице'
          type: integer
          example: 10
        from:
          description: 'Начиная с какого элемента выводится страница'
          type: integer
          example: 11
        to:
          description: 'До какого элемента выводится информация на странице'
          type: integer
          example: 20
        first_page_url:
          description: 'Ссылка на первую страницу'
          type: string
          example: 'http://vi.local/api/chat/get_history?page=1'
          nullable: true
        next_page_url:
          description: 'Ссылка на следующую страницу'
          type: string
          example: 'http://vi.local/api/chat/get_history?page=3'
          nullable: true
        prev_page_url:
          description: 'Ссылка на предыдущую страницу'
          type: string
          example: 'http://vi.local/api/chat/get_history?page=1'
          nullable: true
        path:
          description: 'Ссылка на метод без указания страниц'
          type: string
          example: 'http://vi.local/api/chat/get_history'
      type: object
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key

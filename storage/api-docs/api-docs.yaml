openapi: 3.0.0
info:
  title: 'VIka API'
  description: 'Описание API методов Вики.'
  version: '1.0'
paths:
  /api/widget/abbreviation_help/get_abbreviations:
    get:
      tags:
        - AbbreviationHelpWidget
      summary: 'Получить расшифровку аббревиатур'
      operationId: getAbbreviationHelpWidgetAbbreviations
      parameters:
        -
          name: name
          in: query
          description: 'Короткая форма аббревиатуры'
          required: false
          example: адб
      responses:
        200:
          description: 'Successful operation'
          content:
            application/json:
              schema:
                type: array
                items:
                  description: 'Найденные аббривеатуры'
                  properties:
                    id:
                      description: 'Идентификатор аббривеатуры'
                      type: integer
                      example: 17
                    abbreviation:
                      description: 'Сама аббривеатура'
                      type: string
                      example: АДБ
                    decoding:
                      description: 'Расшифровка аббривеатуры'
                      type: string
                      example: 'Администратор доходов бюджета'
                    description:
                      description: 'Описание аббривеатуры'
                      type: string
                      example: 'Орган государственной власти (государственный орган), орган местного самоуправления, орган местной администрации, орган управления государственным внебюджетным фондом, Центральный банк Российской Федерации, казённое учреждение, осуществляющие в соответствии с законодательством Российской Федерации контроль за правильностью исчисления, полнотой и своевременностью уплаты, начисление, учёт, взыскание и принятие решений о возврате (зачёте) излишне уплаченных (взысканных) платежей, пеней и штрафов по ним, являющихся доходами бюджетов бюджетной системы Российской Федерации, если иное не установлено Бюджетным кодексом Российской Федерации'
                  type: object
  /api/widget/actirovki/cities:
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Получить список населенных пунктов'
      operationId: indexCityActirovkiWidget
      parameters:
        -
          name: page
          in: query
          description: 'Номер страницы для пагинации (если не указано, то пагинация не используется)'
          required: false
          schema:
            type: integer
            example: 1
        -
          name: per_page
          in: query
          description: 'Количество элементов на странице'
          required: false
          schema:
            type: integer
            example: 20
        -
          name: sort
          in: query
          description: 'Поле сортировки, например name или -name'
          required: false
          schema:
            type: string
            example: name
        -
          name: 'filter[name]'
          in: query
          description: 'Фильтр по названию населенного пункта'
          required: false
          schema:
            type: string
            example: Ханты-Мансийск
      responses:
        200:
          description: 'Успешный ответ  (список или пагинация)'
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: 'Список населенных пунктов'
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                  meta:
                    description: 'Метаданные пагинации (LengthAwarePaginator)'
                    properties:
                      total:
                        type: integer
                        example: 100
                      count:
                        type: integer
                        example: 15
                      per_page:
                        type: integer
                        example: 15
                      current_page:
                        type: integer
                        example: 1
                      total_pages:
                        type: integer
                        example: 7
                    type: object
                  links:
                    description: 'Ссылки пагинации (LengthAwarePaginator)'
                    properties:
                      first:
                        type: string
                        example: '/api/widget/actirovki/cities?page=1'
                      last:
                        type: string
                        example: '/api/widget/actirovki/cities?page=7'
                      prev:
                        type: string
                        example: null
                      next:
                        type: string
                        example: '/api/widget/actirovki/cities?page=2'
                    type: object
                type: object
    post:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Создать новый населенный пункт'
      operationId: storeCityActirovkiWidget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 'Название населенного пункта'
                  type: string
                  example: 'г. Омск'
                fias_id:
                  description: 'ФИАС ID'
                  type: string
                  example: 140e31da-27bf-4519-9ea0-6185d681d44e
                reference_city_id:
                  description: 'ID населенного пункта, для клонирования правил по актировкам'
                  type: integer
                  example: '28'
              type: object
      responses:
        201:
          description: 'Населенный пункт создан'
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/City'
                type: object
        422:
          description: 'Ошибка валидации'
        401:
          description: 'Ошибка аутентификации'
        500:
          description: 'Не удалось создать город'
  '/api/widget/actirovki/cities/{city}':
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Получить информацию о населенном пункте'
      operationId: showCityActirovkiWidget
      parameters:
        -
          name: city
          in: path
          description: 'ID населенного пункта'
          required: true
          schema:
            type: integer
          example: 28
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/City'
                type: object
        404:
          description: 'Населенный пункт не найден'
  '/api/widget/actirovki/cities/{city}/weathers':
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Получить историю данных о погоде в населенном пункте'
      operationId: indexByCityWeatherActirovkiWidget
      parameters:
        -
          name: city
          in: path
          description: 'ID населенного пункта'
          required: true
          schema:
            type: integer
          example: 28
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: 'Данные о погоде в населенном пункте'
                    type: array
                    items:
                      $ref: '#/components/schemas/Weather'
                type: object
  '/api/widget/actirovki/cities/{city}/latest-weather':
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Погода для населенного пункта за сегодня'
      operationId: latestWeatherByCityWeatherActirovkiWidget
      parameters:
        -
          name: city
          in: path
          description: 'ID населенного пункта'
          required: true
          schema:
            type: integer
          example: 28
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Weather'
                type: object
        404:
          description: 'Погодные данные за сегодня отсутствуют'
  '/api/widget/actirovki/cities/{city}/weather-ranges':
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Получить правила объявления актировки для населенного пункта'
      operationId: indexByCityWeatherRangeActirovkiWidget
      parameters:
        -
          name: city
          in: path
          description: 'ID населенного пункта'
          required: true
          schema:
            type: integer
          example: 28
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: 'Правила объявления актировки'
                    type: array
                    items:
                      $ref: '#/components/schemas/WeatherRange'
                type: object
  '/api/widget/actirovki/cities/{city}/update':
    post:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Обновить населенный пункт'
      operationId: updateCityActirovkiWidget
      parameters:
        -
          name: city
          in: path
          description: 'ID населенного пункта'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  description: 'Название населенного пункта'
                  type: string
                  example: 'г. Омск'
                fias_id:
                  description: 'ФИАС ID'
                  type: string
                  example: 5a08166f-cfaa-4e95-8233-f0d473883bd3
              type: object
      responses:
        200:
          description: 'Населенный пункт обновлен'
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/City'
                type: object
        422:
          description: 'Ошибка валидации'
        401:
          description: 'Ошибка аутентификации'
  '/api/widget/actirovki/cities/{city}/delete':
    post:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Удалить населенный пункт'
      operationId: destroyCityActirovkiWidget
      parameters:
        -
          name: city
          in: path
          description: 'ID населенного пункта'
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Успешное удаление'
        404:
          description: 'Населенный пункт не найден'
        401:
          description: 'Ошибка аутентификации'
  '/api/widget/actirovki/cities/{city}/actirovki/specific-day':
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Получить актировки за конкретную дату'
      operationId: FetchActirovkiForSpecificDayActirovkiWidget
      parameters:
        -
          name: city
          in: path
          description: 'ID населенного пункта'
          required: true
          schema:
            type: integer
          example: 28
        -
          name: date
          in: query
          description: Дата
          required: true
          schema:
            type: string
            format: date
            example: 15.05.2025
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: 'Данные о погоде в населенном пункте'
                    type: array
                    items:
                      $ref: '#/components/schemas/Actirovki'
                type: object
              example:
                data:
                  -
                    school_shift: '1'
                    status: announced
                    message: '15.05.2025 занятия 1-й смены с 1 по 4 класс отменяются.'
                    row:
                      id: 1
                      city_id: 28
                      weather_id: 1
                      weather_range_id: 1
                      school_shift: 1
                      weather:
                        id: 1
                        city_id: 28
                        temperature: -40
                        wind: 10
                        created_at: '2025-05-15T11:16:19.000000Z'
                      weather_range:
                        id: 1
                        city_id: 28
                        temperature: -29
                        wind: 0
                        school_class: 4
                  -
                    school_shift: '2'
                    status: not_announced
                    message: '15.05.2025 на 11:30 температурные условия не превышают пороговых для объявления актировки 2-й смены.'
                    row: null
  '/api/widget/actirovki/cities/{city}/actirovki/today':
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Получить актировки за текущую дату'
      operationId: fetchActirovkiTodayActirovkiWidget
      parameters:
        -
          name: city
          in: path
          description: 'ID населенного пункта'
          required: true
          schema:
            type: integer
          example: 28
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: 'Данные о погоде в населенном пункте'
                    type: array
                    items:
                      $ref: '#/components/schemas/Actirovki'
                type: object
              example:
                data:
                  -
                    school_shift: '1'
                    status: announced
                    message: '15.05.2025 занятия 1-й смены с 1 по 4 класс отменяются.'
                    row:
                      id: 1
                      city_id: 28
                      weather_id: 1
                      weather_range_id: 1
                      school_shift: 1
                      weather:
                        id: 1
                        city_id: 28
                        temperature: -40
                        wind: 10
                        created_at: '2025-05-15T11:16:19.000000Z'
                      weather_range:
                        id: 1
                        city_id: 28
                        temperature: -29
                        wind: 0
                        school_class: 4
                  -
                    school_shift: '2'
                    status: not_announced
                    message: '15.05.2025 на 11:30 температурные условия не превышают пороговых для объявления актировки 2-й смены.'
                    row: null
  /api/widget/actirovki/rows:
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Получить список актировок'
      operationId: indexRowActirovkiWidget
      parameters:
        -
          name: 'filter[city_id]'
          in: query
          description: 'ID населенного пункта'
          schema:
            type: integer
          example: 28
        -
          name: 'filter[date_from]'
          in: query
          description: 'Дата начала диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 01.01.2025
        -
          name: 'filter[date_to]'
          in: query
          description: 'Дата окончания диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 30.04.2025
        -
          name: 'filter[school_shift]'
          in: query
          description: 'Смена (1 или 2)'
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
            example: 1
        -
          name: 'filter[school_class]'
          in: query
          description: 'Класс, по который объявлена актировка'
          required: false
          schema:
            type: integer
            enum:
              - 4
              - 8
              - 11
            example: 11
        -
          name: per_page
          in: query
          description: 'Количество элементов на странице'
          required: false
          schema:
            type: integer
            example: 20
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: 'Данные о погоде в населенном пункте'
                    type: array
                    items:
                      $ref: '#/components/schemas/Row'
                  links:
                    description: Пагинация
                    type: object
                  meta:
                    description: Пагинация
                    type: object
                type: object
  '/api/widget/actirovki/rows/{row}/cancel':
    post:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Отмена актировки'
      operationId: cancelRowActirovkiWidget
      parameters:
        -
          name: row
          in: path
          description: 'ID актировки'
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Row'
                type: object
  /api/widget/actirovki/rows/export-csv:
    get:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Получить список актировок в CSV'
      operationId: exportCsvRowActirovkiWidget
      parameters:
        -
          name: 'filter[city_id]'
          in: query
          description: 'ID населенного пункта'
          schema:
            type: integer
          example: 28
        -
          name: 'filter[date_from]'
          in: query
          description: 'Дата начала диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 01.01.2025
        -
          name: 'filter[date_to]'
          in: query
          description: 'Дата окончания диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 30.04.2025
        -
          name: 'filter[school_shift]'
          in: query
          description: 'Смена (1 или 2)'
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
            example: 1
        -
          name: 'filter[school_class]'
          in: query
          description: 'Класс, по который объявлена актировка'
          required: false
          schema:
            type: integer
            enum:
              - 4
              - 8
              - 11
            example: 11
      responses:
        200:
          description: 'CSV-файл с данными'
          content:
            'text/csv; charset=UTF-8':
              schema:
                description: 'Поток CSV'
                type: string
                format: binary
  /api/widget/actirovki/statistic:
    get:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Статистика по актировкам за выбранный период с разбивкой по городам'
      operationId: indexStatisticActirovkiWidget
      parameters:
        -
          name: 'filter[city_id]'
          in: query
          description: 'ID населенного пункта'
          schema:
            type: integer
          example: 28
        -
          name: 'filter[date_from]'
          in: query
          description: 'Дата начала диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 01.01.2025
        -
          name: 'filter[date_to]'
          in: query
          description: 'Дата окончания диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 30.04.2025
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  -
                    city: 'пгт. Андра'
                    shifts:
                      1:
                        4: 168
                        8: 187
                        11: 154
                      2:
                        4: 157
                        8: 158
                        11: 166
  /api/widget/actirovki/statistic/all-today:
    get:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Статистика по актировкам сегодня'
      operationId: allTodayStatisticActirovkiWidget
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  shifts:
                    1:
                      4: 22
                      8: 21
                      11: 15
                    2:
                      4: 20
                      8: 11
                      11: 9
  /api/widget/actirovki/weathers:
    get:
      tags:
        - ActirovkiWidgetPublic
      summary: 'Получить историю данных о погоде'
      operationId: indexWeatherActirovkiWidget
      parameters:
        -
          name: 'filter[city_id]'
          in: query
          description: 'ID населенного пункта'
          schema:
            type: integer
          example: 28
        -
          name: 'filter[date_from]'
          in: query
          description: 'Дата начала диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 01.01.2025
        -
          name: 'filter[date_to]'
          in: query
          description: 'Дата окончания диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 30.04.2025
        -
          name: per_page
          in: query
          description: 'Количество элементов на странице'
          required: false
          schema:
            type: integer
            example: 20
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                properties:
                  data:
                    description: 'Данные о погоде'
                    type: array
                    items:
                      $ref: '#/components/schemas/Weather'
                  links:
                    description: Пагинация
                    type: object
                  meta:
                    description: Пагинация
                    type: object
                type: object
    post:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Добавить данные о погоде'
      operationId: storeWeatherActirovkiWidget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                city_id:
                  description: 'ID населенного пункта'
                  type: integer
                  format: int64
                  example: 28
                temperature:
                  description: Температура
                  type: decimal
                  example: -29.3
                wind:
                  description: 'Скорость ветра'
                  type: decimal
                  example: 6.2
              type: object
      responses:
        201:
          description: 'Населенный пункт создан'
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/Weather'
                type: object
        422:
          description: 'Ошибка валидации'
        401:
          description: 'Ошибка аутентификации'
  '/api/widget/actirovki/weathers/{weather}/delete':
    post:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Удалить данные о погоде'
      operationId: destroyWeatherActirovkiWidget
      parameters:
        -
          name: weather
          in: path
          description: 'ID данных о погоде'
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Успешное удаление'
        404:
          description: 'Населенный пункт не найден'
        401:
          description: 'Ошибка аутентификации'
  /api/widget/actirovki/weathers/export-csv:
    get:
      tags:
        - ActirovkiWidgetPrivate
      summary: 'Получить историю данных о погоде'
      operationId: exportCsvWeatherActirovkiWidget
      parameters:
        -
          name: 'filter[city_id]'
          in: query
          description: 'ID населенного пункта'
          schema:
            type: integer
          example: 28
        -
          name: 'filter[date_from]'
          in: query
          description: 'Дата начала диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 01.01.2025
        -
          name: 'filter[date_to]'
          in: query
          description: 'Дата окончания диапазона'
          required: false
          schema:
            type: string
            format: date
            example: 30.04.2025
      responses:
        200:
          description: 'CSV-файл с данными'
          content:
            'application/vnd.ms-excel; charset=UTF-8':
              schema:
                description: 'Поток CSV'
                type: string
                format: binary
  /api/widget/actirovki/weather-ranges:
    get:
      tags:
        - ActirovkiWidgetPublic

  /api/admin/chat/intents/test_llm:
    get:
      tags:
        - AdminIntentController
      summary: 'Тестирование LLM-промпта для интентов'
      operationId: testLLMPrompt
      parameters:
        -
          name: message
          in: query
          description: 'Текст запроса пользователя'
          required: true
          schema:
            type: string
          example: 'хочу регистрацию'
        -
          name: document
          in: query
          description: 'Документ для LLM'
          required: true
          schema:
            type: string
          example: "Вопрос: Регистрация по месту пребывания(кодовые фразы: внесение в домовую книгу;домовая книга)\nОтвет:\nГражданин представляет должностному лицу, ответственному за регистрацию, а при его отсутствии - собственнику жилого помещения:\n\n\nЗаявление о регистрации по месту пребывания, подписанное гражданином и собственником (нанимателем) жилого помещения, указанного в заявлении. Подписи заверяются должностным лицом, ответственным за регистрацию.\nДокумент, удостоверяющий личность.\nДокумент, являющийся основанием для временного проживания в жилом помещении, права на которое не зарегистрированы в Едином государственном реестре недвижимости.\nАкт органа опеки и попечительства о назначении опекуна или попечителя (при установлении опеки или попечительства).\nПисьменное согласие о вселении гражданина в жилое помещение от проживающих совместно с нанимателем жилого помещения совершеннолетних пользователей, наймодателя и всех участников долевой собственности (при необходимости)."
        -
          name: system_prompt
          in: query
          description: 'Системный промпт для LLM'
          required: true
          schema:
            type: string
          example: "Представь, что ты работник миграционной службы, к тебе обращаются по вопросам получения регистрации и прописки.\nТебе необходимо кратко ответить на вопросы связанные с получением прописки.\nОтвет должен быть кратким и структурированным, но отвечающим на запрос пользователя.\nВыдели только важные моменты и ключевые факты.Твоя задача помочь пользователю с ответом. В ответе не указывай, что фраза- синоним.\n Учитывай кодовые фразы вопроса при формировании ответа, кодовые фразы указаны в скобках рядом с вопросом.\nФормируй ответ с учётом кодовой фразы."
      responses:
        200:
          description: 'Результат тестирования LLM-промпта'
          content:
            application/json:
              schema:
                properties:
                  answer:
                    description: 'Ответ LLM'
                    type: string
                    example: "Внесение в домовую книгу:\nРегистрация возможна если Вы предоставите:\n- Паспорт;\n- Документ, подтверждающий право пользования жильем;\n- Согласие собственника жилья (если требуется);\n- Акт органа опеки (в случае опеки над Вами)."
                type: object
